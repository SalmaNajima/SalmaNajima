<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Aesthetic Buttons</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #f8c1d4, #ff69b4);
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            background: rgba(255,255,255,0.2);
            padding: 70px 60px;
            border-radius: 30px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(255, 105, 180, 0.4);
        }

        h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 8px;
        }

        p {
            color: white;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .btn {
            display: inline-block;
            padding: 18px 45px;
            margin: 15px;
            font-size: 1.2rem;
            font-weight: 600;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.4s;
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.5);
        }

        .btn1 {
            background: linear-gradient(45deg, #ff69b4, #ff1493);
        }

        .btn2 {
            background: linear-gradient(45deg, #ff8fab, #db2777);
        }

        .btn:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(255, 20, 147, 0.6);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Pink Aesthetic</h1>
        <p>Klik tombol di bawah</p>
        
        <!-- GANTI LINK INI -->
        <a href="https://docs.google.com/forms/d/e/1FAIpQLScmO8kQxlm_c72olNKeeAf1OftPOIzZsJ1-cMi2LKXw9w0iQw/viewform?usp=header" class="btn btn1" target="_blank">
            Google Form
        </a>
        
        <a href="https://datastudio.google.com/reporting/52de5670-318e-4494-bc29-ab4498394216" class="btn btn2" target="_blank">
            Sajian Data
        </a>
    </div>

</body>
</html>
